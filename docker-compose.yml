services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  back: &back
    build: .
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RETO_DURACION: ${RETO_DURACION}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://escaperoomc15.us.auth0.com/}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.escaperoomc15}
      # Los topics STOMP pasan por RabbitMQ: asi varias instancias del back se reparten los mensajes
      STOMP_RELAY: "true"
      STOMP_HOST: rabbitmq
      STOMP_USUARIO: ${RABBIT_USUARIO}
      STOMP_CLAVE: ${RABBIT_CLAVE}
      # Estado vivo (chat, partidas, sesiones del lobby) compartido entre instancias
      ESTADO_REDIS: "true"
      REDIS_HOST: redis
      REDIS_CLAVE: ${REDIS_CLAVE}
      # Los eventos entre servicios (partida iniciada/terminada, sala cerrada) van por Kafka, como entre microservicios
      EVENTOS_KAFKA: "true"
      KAFKA_SERVIDORES: kafka:9092
      # Cada cuanto se cierran las salas huerfanas (solo con Redis)
      C15_SALAS_BARRIDO: ${SALAS_BARRIDO:-60s}
      # Logs legibles en la consola y copia a Grafana (http://localhost:3000)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      OTEL_ACTIVO: "true"
      OTEL_TRACES_URL: http://observabilidad:4318/v1/traces
      OTEL_LOGS_URL: http://observabilidad:4318/v1/logs
    ports:
      - "${BACK_PORT}:8080"

  # Segunda instancia del back en el 8081 para probar varias instancias: docker compose --profile escalado up -d
  back-2:
    <<: *back
    profiles: ["escalado"]
    ports:
      - "8081:8080"

  # Broker de los topics STOMP (plugin STOMP en 61613); consola en http://localhost:15672
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USUARIO}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_CLAVE}
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:61613:61613"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Estado vivo compartido; todo caduca en minutos (sin disco: si se reinicia, se pierde como antes)
  redis:
    image: redis:8.8.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_CLAVE}", "--save", "", "--appendonly", "no", "--notify-keyspace-events", "Ex"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_CLAVE\" --no-auth-warning ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_CLAVE: ${REDIS_CLAVE}

  # Eventos entre servicios (en Azure: Event Hubs con la API de Kafka). Un solo nodo KRaft, sin Zookeeper;
  # los eventos se guardan un dia (solo sirven mientras se juega)
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Grafana con Tempo (trazas) y Loki (logs), solo para desarrollo
  observabilidad:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
