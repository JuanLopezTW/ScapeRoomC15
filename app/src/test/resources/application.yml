spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Proveedor de identidad (Auth0): no son secretos
          issuer-uri: ${AUTH0_ISSUER:https://escaperoomc15.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.escaperoomc15}
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

c15:
  salas:
    gracia-desconexion: 200ms
  partida:
    cuenta-regresiva: 1s
