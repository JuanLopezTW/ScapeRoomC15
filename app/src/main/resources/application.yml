spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Proveedor de identidad (Auth0): no son secretos
          issuer-uri: ${AUTH0_ISSUER:https://escaperoomc15.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.escaperoomc15}
  application:
    name: escaperoom-c15
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:escaperoom_c15}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PUERTO:6379}
      password: ${REDIS_CLAVE:}
      # Solo se usa como almacen de estado, no como repositorio de Spring Data
      repositories:
        enabled: false
  # Solo se conecta con c15.eventos.kafka=true (Event Hubs en Azure: bootstrap <namespace>.servicebus.windows.net:9093 + SASL)
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    producer:
      # Kafka confirma cuando todas las replicas lo tienen y no duplica por reintentos del productor
      acks: all
    consumer:
      # Un grupo nuevo empieza por lo que llegue (no repite partidas viejas); el grupo luego recuerda por donde va
      auto-offset-reset: ${KAFKA_DESDE:latest}
    template:
      # La traza (traceId) viaja en los headers del mensaje hasta quien lo recibe
      observation-enabled: true
    listener:
      observation-enabled: true
    admin:
      # Crea los topics si no existen (en Event Hubs se crean a mano)
      auto-create: ${KAFKA_CREAR_TOPICS:true}

server:
  port: 8080

c15:
  estado:
    # false: estado vivo en memoria (una sola instancia). true: en Redis, compartido entre instancias.
    redis: ${ESTADO_REDIS:false}
    # Todo en Redis caduca: lo de una partida dura lo que la partida mas este margen (regla del profe: minutos, nunca mas de 1 h)
    margen: 10m
  salas:
    # Lo que espera el back antes de cerrar la sala si se desconecto el anfitrion (los invitados salen de una)
    gracia-desconexion: 20s
    # Con Redis: cada cuanto una instancia cierra las salas huerfanas (en espera sin nadie, o sin partida viva)
    barrido: 60s
  partida:
    # La duracion ya no se configura: la elige el anfitrion al crear la sala (5, 10 o 15 min)
    cuenta-regresiva: 5s
  reto:
    # 5 s del aviso del front (ModalDesafio) + 20 s de juego: el reto corre desde que sale el aviso
    duracion: ${RETO_DURACION:25s}
  eventos:
    # false: los eventos entre servicios van en memoria (un hilo propio). true: por Kafka, como entre microservicios
    kafka: ${EVENTOS_KAFKA:false}
    prefijo: ${KAFKA_PREFIJO:c15.}
    # Todas las instancias del monolito en el mismo grupo: cada evento lo atiende una sola
    grupo: ${KAFKA_GRUPO:c15-monolito}
  stomp:
    broker:
      # false: broker en memoria (una sola instancia). true: RabbitMQ con el plugin STOMP (varias instancias)
      relay: ${STOMP_RELAY:false}
      host: ${STOMP_HOST:localhost}
      puerto: ${STOMP_PUERTO:61613}
      usuario: ${STOMP_USUARIO:}
      clave: ${STOMP_CLAVE:}

# Logs en JSON salvo con el perfil "local"; el traceId lo agrega Micrometer Tracing
logging:
  structured:
    format:
      console: ecs
  level:
    # El cliente de Kafka escribe mucho en INFO (configuracion, rebalanceos); solo avisos y errores
    org.apache.kafka: warn

management:
  health:
    redis:
      # Sin Redis encendido no se revisa (si no, el health daria DOWN en Azure)
      enabled: ${ESTADO_REDIS:false}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_ACTIVO:false}
    logging:
      endpoint: ${OTEL_LOGS_URL:http://localhost:4318/v1/logs}
      export:
        enabled: ${OTEL_ACTIVO:false}
