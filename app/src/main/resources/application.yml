spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Proveedor de identidad (Auth0): no son secretos
          issuer-uri: ${AUTH0_ISSUER:https://escaperoomc15.us.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.escaperoomc15}
  application:
    name: escaperoom-c15
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:escaperoom_c15}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

c15:
  salas:
    # Lo que espera el back antes de cerrar la sala si se desconecto el anfitrion (los invitados salen de una)
    gracia-desconexion: 20s
  partida:
    duracion: ${PARTIDA_DURACION:30m}
    cuenta-regresiva: 5s
  reto:
    # 5 s del aviso del front (ModalDesafio) + 20 s de juego: el reto corre desde que sale el aviso
    duracion: ${RETO_DURACION:25s}
