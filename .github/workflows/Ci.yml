name: CI

# Etapas: compile -> test -> (analysis | build) -> deploy
# deploy solo corre en push a main.

# Las ramas de trabajo se validan con el PR; push solo en develop/main
# (con "**" cada push a una rama con PR abierto corría la pipeline dos veces).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela para no cortar un deploy a la mitad
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Permisos del GITHUB_TOKEN declarados por job (mínimo privilegio)
jobs:
  compile:
    name: Compilar
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # test-compile para que un test que no compila falle aquí y no en "test"
      - name: Compilar (main + tests)
        run: mvn -B -ntp test-compile

  test:
    name: Probar
    permissions:
      contents: read
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify corre los tests y genera el reporte de JaCoCo (configurado en el pom raíz)
      - name: Pruebas + cobertura
        run: mvn -B -ntp verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore

      - name: Subir reportes de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
            app/target/site/jacoco-aggregate/
          if-no-files-found: warn

  analysis:
    name: Analisis (JaCoCo + SonarQube Cloud)
    permissions:
      contents: read
      pull-requests: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial para el blame / código nuevo

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Trae los reportes del job "test" en sus rutas originales; Sonar lee app/target/site/jacoco-aggregate/jacoco.xml
      - name: Descargar reportes de cobertura
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: .

      - name: Descargar reportes de pruebas
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: .

      # Cobertura agregada (incluye los tests de integración de app), por módulo y total
      - name: Resumen de cobertura
        run: |
          csv=app/target/site/jacoco-aggregate/jacoco.csv
          [ -f "$csv" ] || { echo "::warning::No se encontró $csv"; exit 0; }
          {
            echo "### Cobertura JaCoCo agregada (líneas)"
            echo "| Módulo | Cubiertas | Total | % |"
            echo "|---|---|---|---|"
            awk -F, 'NR>1 { sub(/^app\//, "", $1); missed[$1]+=$8; covered[$1]+=$9; tm+=$8; tc+=$9 }
              END { for (m in missed) { t=missed[m]+covered[m];
                      printf "| %s | %d | %d | %.1f%% |\n", m, covered[m], t, (t>0 ? 100*covered[m]/t : 0) }
                    printf "| **TOTAL** | %d | %d | **%.1f%%** |\n", tc, tm+tc, (tm+tc>0 ? 100*tc/(tm+tc) : 0) }' "$csv"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sonar necesita los .class (main y test); los tests no se repiten, la cobertura ya viene del job "test".
      # Organización, project key y host están en las <properties> del pom raíz.
      - name: Analizar con SonarQube Cloud
        if: env.RUN_SONAR == 'true'
        run: >
          mvn -B -ntp -DskipTests -Djacoco.skip=true test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Sonar omitido
        if: env.RUN_SONAR != 'true'
        run: echo "::notice::Sonar omitido (sin SONAR_TOKEN o rama distinta de main/develop/PR). La cobertura de JaCoCo sí quedó en el artefacto jacoco-reports."

  build:
    name: Construir imagen Docker
    permissions:
      contents: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Solo comprueba que el Dockerfile construye; no publica nada
      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: escaperoom-c15:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [analysis, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas (el repo es JuanLopezTW/ScapeRoomC15)
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login a GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
