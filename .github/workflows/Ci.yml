name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela para no cortar un deploy a la mitad
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  compile:
    name: Compilar
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      - name: Compilar (main + tests)
        run: mvn -B -ntp test-compile

  test:
    name: Probar
    permissions:
      contents: read
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      - name: Pruebas + cobertura
        run: mvn -B -ntp verify

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore

      - name: Subir reportes de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/
            app/target/site/jacoco-aggregate/
          if-no-files-found: warn

  analysis:
    name: Analisis (JaCoCo + SonarQube Cloud)
    permissions:
      contents: read
      pull-requests: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Sonar en PRs y en main (rama principal en SonarCloud). En develop no: el plan solo analiza la
      # rama principal, y el código de develop ya se analiza en su PR.
      RUN_SONAR: ${{ secrets.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref_name == 'main') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial para el blame / código nuevo

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      - name: Descargar reportes de cobertura
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: .

      - name: Descargar reportes de pruebas
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: .

      # Cobertura agregada (incluye los tests de integración de app), por módulo y total
      - name: Resumen de cobertura
        run: |
          csv=app/target/site/jacoco-aggregate/jacoco.csv
          [ -f "$csv" ] || { echo "::warning::No se encontró $csv"; exit 0; }
          {
            echo "### Cobertura JaCoCo agregada (líneas)"
            echo "| Módulo | Cubiertas | Total | % |"
            echo "|---|---|---|---|"
            awk -F, 'NR>1 { sub(/^app\//, "", $1); missed[$1]+=$8; covered[$1]+=$9; tm+=$8; tc+=$9 }
              END { for (m in missed) { t=missed[m]+covered[m];
                      printf "| %s | %d | %d | %.1f%% |\n", m, covered[m], t, (t>0 ? 100*covered[m]/t : 0) }
                    printf "| **TOTAL** | %d | %d | **%.1f%%** |\n", tc, tm+tc, (tm+tc>0 ? 100*tc/(tm+tc) : 0) }' "$csv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Analizar con SonarQube Cloud
        if: env.RUN_SONAR == 'true'
        run: >
          mvn -B -ntp -DskipTests -Djacoco.skip=true test-compile
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Sonar omitido
        if: env.RUN_SONAR != 'true'
        run: echo "::notice::Sonar omitido (sin SONAR_TOKEN o no es PR ni main). La cobertura de JaCoCo sí quedó en el artefacto jacoco-reports."

  build:
    name: Construir imagen Docker
    permissions:
      contents: read
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0


      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: escaperoom-c15:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [analysis, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      AZURE_RESOURCE_GROUP: Escape_RoomC15
      AZURE_WEBAPP_NAME: escaperoomc15-api
      AZURE_WEBAPP_URL: https://escaperoomc15-api-gcbyhbb5ajhhfwh8.centralus-01.azurewebsites.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login a GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      - name: Login en Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Reiniciar Web App
        run: |
          az webapp restart \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP"

      - name: Verificar que la app responde
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$AZURE_WEBAPP_URL" || echo 000)
            echo "Intento $i: HTTP $code"
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "### Deploy OK: $AZURE_WEBAPP_URL (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::La app no respondió tras el deploy. Revisa el Log stream del Web App."
          exit 1

      - name: Logout de Azure
        if: always()
        run: az logout || true