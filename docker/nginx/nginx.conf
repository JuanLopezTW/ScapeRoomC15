# Balanceador local para probar varias instancias del back (docker-compose.escalado.yml).
# Reparte por turnos, sin sesiones pegadas a una instancia: cualquier jugador puede caer en cualquiera,
# que es justo lo que el estado en Redis y el broker en RabbitMQ permiten.

events {}

http {
    upstream back {
        # Si una instancia no responde se saca 10 s y se reintenta en la otra
        server back:8080 max_fails=1 fail_timeout=10s;
        server back-2:8080 max_fails=1 fail_timeout=10s;
    }

    # Para el WebSocket: pasar el "Upgrade" solo cuando el cliente lo pide
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # Cada respuesta dice que instancia la atendio (para ver el reparto en las pruebas)
        add_header X-Instancia $upstream_addr always;

        location /ws {
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # El servidor manda latidos cada 10 s; la conexion vive mientras haya trafico
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://back;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Si la instancia se cae antes de responder, reintenta en la otra (tambien un POST: no alcanzo a llegar)
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
        }
    }
}
